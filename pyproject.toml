[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "querypilot"
version = "0.1.0"
description = "Governed text-to-SQL agent: schema retrieval, self-correcting SQL generation, row/column access policies and lineage logging."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2",
  "duckdb>=1.0",
  "sqlglot>=25",
  "pyarrow>=14",
  "pyyaml>=6",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
querypilot = "querypilot.cli:main"

[tool.setuptools.packages.find]
include = ["querypilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
querypilot = ["config/*.yaml"]
